{% extends 'base.html' %}
{% load static %}

{% block title %}Password Berhasil Diubah — Kahta Grafika{% endblock %}

{% block extra_css %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
<div class="login-page">
  <div class="grain"></div>
  <header class="brand-header">
    <h1 class="brand-name">Kahta Grafika</h1>
    <p class="brand-tagline">Premium Packaging Atelier</p>
  </header>

  <main class="login-card" role="main" style="text-align: center;">
    <div class="card-top">
      <h2 class="card-title">Berhasil!</h2>
      <p class="card-subtitle" style="margin-top: 16px; color: #27ae60;">
        Password Anda telah berhasil diubah.
      </p>
    </div>

    <div class="form-meta" style="margin-top: 30px; justify-content: center;">
      <a href="{% url 'accounts:login' %}" class="btn-google" style="max-width: 200px; display: inline-flex;">
        <span>Masuk Sekarang</span>
      </a>
    </div>
  </main>
</div>
{% endblock %}
